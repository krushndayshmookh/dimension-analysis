apiVersion: apps/v1
kind: Deployment
metadata:
  name: dimension-analysis
  namespace: dimension-analysis
  labels: { app: dimension-analysis }
spec:
  # One replica only: data is plain files on a ReadWriteOnce volume with no locking.
  replicas: 1
  strategy:
    type: Recreate   # the old pod must release the volume before the new one starts
  selector:
    matchLabels: { app: dimension-analysis }
  template:
    metadata:
      labels: { app: dimension-analysis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: dimension-analysis:latest   # replaced by the images: entry in kustomization.yaml
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - { name: DATA_DIR, value: /data }
            # The site is only reachable over HTTPS (Cloudflare), so always mark the session cookie Secure.
            - { name: COOKIE_SECURE, value: "true" }
            # Cloudflare sets this to the visitor's address; it keys the login throttle.
            - { name: CLIENT_IP_HEADER, value: CF-Connecting-IP }
            # Optional: set a fixed session-signing key instead of the one generated on the volume.
            # - name: SESSION_SECRET
            #   valueFrom: { secretKeyRef: { name: dimension-analysis, key: session-secret } }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }   # backups and restores are parsed in memory
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dimension-analysis-data }
        - name: tmp
          emptyDir: {}
