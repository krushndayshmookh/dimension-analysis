apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dimension-analysis
  namespace: dimension-analysis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: dimension.dayshmookh.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dimension-analysis
                port: { name: http }
